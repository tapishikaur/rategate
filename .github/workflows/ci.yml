name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rategate
          POSTGRES_PASSWORD: rategate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rategate" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RATEGATE_TEST_DB: postgres://rategate:rategate@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format, vet and test (race detector on)
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race -count=1 ./...

  # The real stack: PostgreSQL, the backend, 2 gateways, nginx and Prometheus. No latency is
  # measured here: shared CI runners are too noisy for that, and it's done on a fixed machine.
  compose:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: The limit is shared across 2 gateways (sync vs local mode)
        run: |
          bash scripts/demo.sh "$RUNNER_TEMP/demo.md"
          cat "$RUNNER_TEMP/demo.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Rejections and latency are exported to Prometheus
        run: |
          python3 -I scripts/prom_check.py --out "$RUNNER_TEMP/prometheus.md"
          cat "$RUNNER_TEMP/prometheus.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
