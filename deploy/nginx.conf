# The load balancer in front of the two gateways: round robin, with kept-alive connections.
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # Logging every request costs CPU on a 2-core machine during the latency test.
  access_log off;

  # Docker's DNS. The scripts recreate the gateways (to switch MODE) while nginx keeps
  # running, and a recreated container may get a new IP address. With "resolve", nginx looks
  # the names up again every couple of seconds instead of keeping the addresses from startup,
  # which would turn every request into a 502.
  resolver 127.0.0.11 valid=2s ipv6=off;

  upstream gateways {
    zone gateways 64k; # shared memory, needed for "resolve"
    server gateway-1:8080 resolve;
    server gateway-2:8080 resolve;
    # Reuse connections to the gateways. Opening a TCP connection per request would add a
    # round trip and CPU to every request, and that would be measured as gateway latency.
    keepalive 64;
  }

  server {
    listen 8080;

    location = /nginx-health {
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;          # keep-alive to the upstream needs HTTP/1.1...
      proxy_set_header Connection "";  # ...and no "Connection: close" passed through
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
